<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Planner App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons (replaces Lucide) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Custom Animations */
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .7; transform: scale(1.05); }
        }
        .animate-pulse-fast {
            animation: pulse-fast 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Utility transitions */
        .transition-transform { transition-property: transform; }
        .transition-opacity { transition-property: opacity; }
        .duration-700 { transition-duration: 700ms; }
        .ease-in-out { transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased overflow-x-hidden h-screen w-screen relative">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="absolute inset-0 bg-white flex flex-col items-center justify-center p-4 z-50 transition-opacity duration-500">
        <!-- Animated Icons Container -->
        <div class="relative w-32 h-32 mb-8 flex items-center justify-center">
            <!-- Icon 1 -->
            <div id="splash-icon-1" class="absolute transition-all duration-700 ease-in-out -translate-x-20 -translate-y-20 -rotate-90 opacity-100 text-blue-500">
                <i class="ph ph-stack" style="font-size: 56px;"></i>
            </div>
            <!-- Icon 2 -->
            <div id="splash-icon-2" class="absolute transition-all duration-700 ease-in-out translate-x-20 -translate-y-20 rotate-90 opacity-100 text-cyan-400">
                <i class="ph ph-cube" style="font-size: 56px;"></i>
            </div>
            <!-- Icon 3 -->
            <div id="splash-icon-3" class="absolute transition-all duration-700 ease-in-out translate-x-0 translate-y-20 rotate-180 opacity-100 text-indigo-500">
                <i class="ph ph-lightning" style="font-size: 56px;"></i>
            </div>

            <!-- Final Merged App Logo -->
            <div id="splash-logo" class="absolute transition-all duration-500 ease-out transform scale-50 opacity-0">
                <div class="bg-blue-50 w-24 h-24 rounded-3xl flex items-center justify-center shadow-xl shadow-blue-200/50 border border-blue-100">
                    <i class="ph ph-calendar-blank text-blue-600 animate-pulse-fast" style="font-size: 48px;"></i>
                </div>
            </div>
        </div>

        <!-- Typewriter Text Container -->
        <div class="h-16 flex items-center justify-center">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-500 tracking-wider flex items-center">
                <span id="splash-text"></span>
                <span id="splash-cursor" class="w-1 md:w-1.5 h-8 md:h-10 ml-2 bg-blue-500 transition-opacity opacity-0"></span>
            </h1>
        </div>

        <!-- Developer Credit -->
        <div id="splash-credit" class="absolute bottom-6 sm:bottom-12 transition-all duration-1000 ease-out translate-y-5 opacity-0 w-full text-center px-4 left-0">
            <p class="text-slate-400 text-xs sm:text-sm tracking-widest uppercase font-medium">
                Developed by <span class="text-blue-600 font-bold">Abubakar iltaf</span>
            </p>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="hidden absolute inset-0 bg-slate-50 flex flex-col items-center justify-center p-4 z-40">
        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 sm:p-8 w-full max-w-md slide-up relative z-10">
            <div class="text-center mb-6 sm:mb-8">
                <div class="bg-blue-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="ph ph-calendar-blank text-blue-600" style="font-size: 32px;"></i>
                </div>
                <h1 class="text-3xl font-bold text-slate-900">Flutter Tech</h1>
                <p class="text-slate-500 mt-2">Sign in to your workspace</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-5">
                <div id="login-error" class="hidden p-3 bg-red-50 text-red-600 rounded-xl text-sm font-medium border border-red-100 text-center fade-in">
                    Invalid username or password
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                    <div class="relative">
                        <i class="ph ph-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" style="font-size: 20px;"></i>
                        <input id="username" type="text" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors" placeholder="Enter username" required />
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <i class="ph ph-lock-key absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" style="font-size: 20px;"></i>
                        <input id="password" type="password" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors" placeholder="Enter password" required />
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl hover:bg-blue-700 font-semibold transition-colors flex items-center justify-center gap-2 mt-2 shadow-md shadow-blue-200">
                    Sign In
                </button>
            </form>
            
            <div class="mt-6 text-center text-xs text-slate-400">
                <p>Hint: Try <b>Flutter</b> / <b>12345</b></p>
            </div>
        </div>

        <!-- Under Development Badge -->
        <div class="mt-8 fade-in" style="animation-delay: 0.3s;">
            <div class="flex items-center gap-2 bg-slate-200/50 px-4 py-2 rounded-full border border-slate-200 shadow-sm backdrop-blur-sm">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span>
                </span>
                <p class="text-slate-500 text-sm font-medium tracking-wide">
                    App is currently under development
                </p>
            </div>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="app-screen" class="hidden min-h-screen bg-slate-50 flex flex-col md:flex-row w-full overflow-hidden">
        
        <!-- Mobile Header (Visible only on small screens) -->
        <header class="md:hidden bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-sm w-full">
            <div class="flex items-center gap-2 font-bold text-xl text-slate-900">
                <i class="ph ph-calendar-blank text-blue-600" style="font-size: 26px;"></i>
                Flutter Tech
            </div>
            <button onclick="toggleMobileMenu()" class="p-2 text-slate-600 hover:bg-slate-100 hover:text-blue-600 rounded-xl transition-colors">
                <i class="ph ph-list" style="font-size: 28px;"></i>
            </button>
        </header>

        <!-- Mobile Overlay -->
        <div id="mobile-overlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden transition-opacity duration-300 opacity-0"></div>

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col fixed inset-y-0 left-0 h-full shadow-2xl md:shadow-sm z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
            <div class="p-6 flex items-start justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
                        <i class="ph ph-calendar-blank text-blue-600" style="font-size: 28px;"></i>
                        Flutter Tech
                    </h1>
                    <p class="text-sm text-slate-500 mt-1">Your Personal Organizer</p>
                </div>
                <button onclick="toggleMobileMenu()" class="md:hidden p-2 -mr-2 text-slate-400 hover:bg-slate-100 hover:text-red-500 rounded-lg transition-colors">
                    <i class="ph ph-x" style="font-size: 24px;"></i>
                </button>
            </div>
            
            <nav id="sidebar-nav" class="flex-1 px-4 space-y-2 overflow-y-auto pb-4">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 bg-blue-600 text-white shadow-md">
                    <i class="ph ph-squares-four" style="font-size: 20px;"></i><span class="font-medium">Dashboard</span>
                </button>
                <button onclick="switchTab('tasks')" id="nav-tasks" class="nav-item w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-600 hover:bg-blue-50 hover:text-blue-600">
                    <i class="ph ph-list-checks" style="font-size: 20px;"></i><span class="font-medium">Tasks & Routines</span>
                </button>
                <button onclick="switchTab('birthdays')" id="nav-birthdays" class="nav-item w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-600 hover:bg-blue-50 hover:text-blue-600">
                    <i class="ph ph-gift" style="font-size: 20px;"></i><span class="font-medium">Birthdays</span>
                </button>
                <button onclick="switchTab('notes')" id="nav-notes" class="nav-item w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-600 hover:bg-blue-50 hover:text-blue-600">
                    <i class="ph ph-note" style="font-size: 20px;"></i><span class="font-medium">Notes & Ideas</span>
                </button>
                <button onclick="switchTab('monthly-sheet')" id="nav-monthly-sheet" class="nav-item w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-600 hover:bg-blue-50 hover:text-blue-600">
                    <i class="ph ph-table" style="font-size: 20px;"></i><span class="font-medium">Monthly Task Sheet</span>
                </button>
                <button onclick="switchTab('team-tasks')" id="nav-team-tasks" class="nav-item w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-600 hover:bg-blue-50 hover:text-blue-600">
                    <i class="ph ph-users" style="font-size: 20px;"></i><span class="font-medium">Team Tracker</span>
                </button>
            </nav>

            <div class="p-4 border-t border-slate-100 text-xs text-slate-400 text-center bg-white">
                Flutter Tech App Preview
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 md:ml-64 w-full overflow-y-auto h-[calc(100vh-65px)] md:h-screen">
            <div id="main-content-area" class="p-4 sm:p-8 max-w-6xl mx-auto w-full"></div>
        </main>
    </div>

    <!-- Application Logic -->
    <script>
        // --- Mock Initial Data ---
        let tasks = [
            { id: 1, text: "Check morning emails", type: "daily", completed: false, time: "09:00", alarmPlayed: false },
            { id: 2, text: "Submit daily status report", type: "daily", completed: false, time: "", alarmPlayed: false },
            { id: 3, text: "Team alignment meeting", type: "weekly", completed: false, time: "15:00", alarmPlayed: false },
            { id: 4, text: "Update project roadmap", type: "weekly", completed: true, time: "", alarmPlayed: false },
            { id: 5, text: "Monthly billing reconciliation", type: "monthly", completed: false, time: "", alarmPlayed: false },
        ];

        let birthdays = [
            { id: 1, name: "Sarah (Manager)", date: "1985-05-12" },
            { id: 2, name: "John (IT Support)", date: "1990-05-28" },
            { id: 3, name: "Emma (Design)", date: "1992-11-05" },
        ];

        let notes = [
            { id: 1, title: "Q3 Goals", content: "Focus on improving the automated deployment pipeline." },
            { id: 2, title: "Meeting prep", content: "Ask about the new budget allocation for the marketing tool." }
        ];

        let sheetTasks = [
            { id: 1, task: "Client Website Redesign", status: "pending" },
            { id: 2, task: "Q1 Tax Filing", status: "not started" },
            { id: 3, task: "Server Maintenance", status: "completed" },
        ];

        let teamTasks = [
            { id: 1, member: "Sarah", task: "Update Design System", status: "in progress" },
            { id: 2, member: "John", task: "Database Migration", status: "pending" },
            { id: 3, member: "Emma", task: "User Research Interviews", status: "completed" },
        ];

        let activeTab = 'dashboard';
        let clockInterval;
        let alarmInterval;
        let isAuthenticated = false;
        let isMobileMenuOpen = false;

        // --- MOBILE MENU LOGIC ---
        window.toggleMobileMenu = function() {
            isMobileMenuOpen = !isMobileMenuOpen;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');

            if (isMobileMenuOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        };

        // --- SPLASH SCREEN LOGIC ---
        function runSplashAnimation() {
            setTimeout(() => {
                document.getElementById('splash-icon-1').className = "absolute transition-all duration-700 ease-in-out translate-x-0 translate-y-0 rotate-0 opacity-0 text-blue-500";
                document.getElementById('splash-icon-2').className = "absolute transition-all duration-700 ease-in-out translate-x-0 translate-y-0 rotate-0 opacity-0 text-cyan-400";
                document.getElementById('splash-icon-3').className = "absolute transition-all duration-700 ease-in-out translate-x-0 translate-y-0 rotate-0 opacity-0 text-indigo-500";
            }, 100);

            setTimeout(() => {
                document.getElementById('splash-logo').className = "absolute transition-all duration-500 ease-out transform scale-100 opacity-100";
            }, 900);

            setTimeout(() => {
                const fullText = "Flutter Tech";
                let i = 0;
                document.getElementById('splash-cursor').classList.add('opacity-100');
                const typeInterval = setInterval(() => {
                    document.getElementById('splash-text').textContent = fullText.slice(0, i + 1);
                    i++;
                    if (i === fullText.length) {
                        clearInterval(typeInterval);
                        document.getElementById('splash-cursor').classList.add('blink');
                        document.getElementById('splash-credit').classList.replace('translate-y-5', 'translate-y-0');
                        document.getElementById('splash-credit').classList.replace('opacity-0', 'opacity-100');
                    }
                }, 120);
            }, 1400);

            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('opacity-0');
                setTimeout(() => {
                    document.getElementById('splash-screen').classList.add('hidden');
                    document.getElementById('login-screen').classList.remove('hidden');
                }, 500); // Wait for fade out
            }, 4500);
        }

        runSplashAnimation();

        // --- LOGIN LOGIC ---
        window.handleLogin = function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'Flutter' && pass === '12345') {
                isAuthenticated = true;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                startApp();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        };

        // --- CORE APP LOGIC ---
        function startApp() {
            renderView();
            startClock();
            startAlarms();
        }

        function startClock() {
            if(clockInterval) clearInterval(clockInterval);
            clockInterval = setInterval(() => {
                if(activeTab === 'dashboard') {
                    renderDashboardHeaderOnly();
                }
            }, 1000);
        }

        function playAlarmAnnouncement(taskTexts) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const playTone = (freq, startTime, duration) => {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(freq, startTime);
                    gainNode.gain.setValueAtTime(0.3, startTime);
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.start(startTime);
                    oscillator.stop(startTime + duration);
                };
                const now = audioCtx.currentTime;
                playTone(880, now, 0.2);
                playTone(880, now + 0.3, 0.2);
            } catch (error) {
                console.error("Audio playback failed", error);
            }

            if ('speechSynthesis' in window) {
                setTimeout(() => {
                    taskTexts.forEach(text => {
                        const utterance = new SpeechSynthesisUtterance(`Reminder: ${text}`);
                        utterance.volume = 1;
                        utterance.rate = 0.9;
                        utterance.pitch = 1;
                        window.speechSynthesis.speak(utterance);
                    });
                }, 800);
            }
        }

        function startAlarms() {
            if(alarmInterval) clearInterval(alarmInterval);
            alarmInterval = setInterval(() => {
                if (!isAuthenticated) return;
                
                const now = new Date();
                const currentHours = now.getHours().toString().padStart(2, '0');
                const currentMinutes = now.getMinutes().toString().padStart(2, '0');
                const currentTime = `${currentHours}:${currentMinutes}`;
                let tasksToAnnounce = [];

                tasks = tasks.map(task => {
                    if (task.time === currentTime && !task.completed && !task.alarmPlayed) {
                        tasksToAnnounce.push(task.text);
                        return { ...task, alarmPlayed: true };
                    }
                    if (task.time !== currentTime && task.alarmPlayed) {
                        return { ...task, alarmPlayed: false };
                    }
                    return task;
                });

                if (tasksToAnnounce.length > 0) {
                    playAlarmAnnouncement(tasksToAnnounce);
                }
            }, 10000);
        }

        // --- NAVIGATION & ROUTING ---
        window.switchTab = function(tabId) {
            activeTab = tabId;
            // Update nav styling
            document.querySelectorAll('.nav-item').forEach(el => {
                el.className = "nav-item w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-600 hover:bg-blue-50 hover:text-blue-600";
            });
            const activeEl = document.getElementById(`nav-${tabId}`);
            activeEl.className = "nav-item w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 bg-blue-600 text-white shadow-md";
            
            // Close mobile menu on tab switch
            if (window.innerWidth < 768 && isMobileMenuOpen) {
                toggleMobileMenu();
            }

            renderView();
        }

        function renderView() {
            const container = document.getElementById('main-content-area');
            container.innerHTML = ''; // clear

            switch(activeTab) {
                case 'dashboard': container.innerHTML = getDashboardHTML(); break;
                case 'tasks': container.innerHTML = getTasksHTML(); break;
                case 'birthdays': container.innerHTML = getBirthdaysHTML(); break;
                case 'notes': container.innerHTML = getNotesHTML(); break;
                case 'monthly-sheet': container.innerHTML = getSheetHTML(); break;
                case 'team-tasks': container.innerHTML = getTeamTasksHTML(); break;
            }
        }

        // --- VIEW RENDERERS (HTML Generators) ---
        
        function getGreeting() {
            const currentHour = new Date().getHours();
            if (currentHour >= 5 && currentHour < 12) return 'Good morning';
            else if (currentHour >= 12 && currentHour < 17) return 'Good afternoon';
            return 'Good evening';
        }

        function getTimeString() { return new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }); }
        function getDateString() { return new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); }

        function renderDashboardHeaderOnly() {
            const headerGreeting = document.getElementById('dash-greeting');
            const headerTime = document.getElementById('dash-time');
            const headerDate = document.getElementById('dash-date');
            
            if(headerGreeting) headerGreeting.innerText = `${getGreeting()}! 👋`;
            if(headerTime) headerTime.innerText = getTimeString();
            if(headerDate) headerDate.innerText = getDateString();
        }

        function getDashboardHTML() {
            const pendingDaily = tasks.filter(t => t.type === 'daily' && !t.completed);
            
            const today = new Date();
            let upcoming = birthdays.map(b => {
                const bDate = new Date(b.date);
                let nextBirthday = new Date(today.getFullYear(), bDate.getMonth(), bDate.getDate());
                if (nextBirthday < today) nextBirthday.setFullYear(today.getFullYear() + 1);
                const diffDays = Math.ceil(Math.abs(nextBirthday - today) / (1000 * 60 * 60 * 24));
                return { ...b, nextBirthday, diffDays };
            }).sort((a, b) => a.diffDays - b.diffDays).slice(0, 3);

            let pendingTasksList = pendingDaily.length === 0 
                ? `<div class="text-center py-8 text-slate-400">
                    <i class="ph ph-check-circle mx-auto mb-3 text-emerald-400 opacity-50" style="font-size: 48px; display:block;"></i>
                    <p>All daily tasks completed! Great job.</p>
                   </div>`
                : `<ul class="space-y-3">` + pendingDaily.map(task => `
                    <li class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <button onclick="toggleTask(${task.id})" class="text-slate-400 hover:text-emerald-500 transition-colors">
                            <i class="ph ph-circle" style="font-size: 22px;"></i>
                        </button>
                        <span class="text-slate-700 font-medium">${task.text}</span>
                    </li>
                  `).join('') + `</ul>`;

            let bdaysList = upcoming.length === 0
                ? `<p class="text-slate-500 text-sm">No upcoming birthdays.</p>`
                : `<ul class="space-y-4">` + upcoming.map(b => `
                    <li class="flex items-center justify-between p-3 rounded-xl bg-purple-50 border border-purple-100">
                        <div>
                            <p class="font-semibold text-slate-800">${b.name}</p>
                            <p class="text-xs text-purple-600 font-medium">${b.nextBirthday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-bold text-slate-700">${b.diffDays === 0 ? 'Today! 🎉' : `in ${b.diffDays}d`}</span>
                        </div>
                    </li>
                  `).join('') + `</ul>`;

            return `
            <div class="fade-in slide-up">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4">
                    <h2 id="dash-greeting" class="text-3xl font-bold text-slate-900">${getGreeting()}! 👋</h2>
                    <div class="flex flex-col sm:items-end bg-white px-5 py-2.5 rounded-2xl shadow-sm border border-slate-200">
                        <span id="dash-time" class="text-xl font-bold text-slate-800 tracking-tight">${getTimeString()}</span>
                        <span id="dash-date" class="text-xs font-medium text-slate-500 uppercase tracking-wider">${getDateString()}</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-xl font-semibold flex items-center gap-2">
                                <i class="ph ph-list-checks text-blue-500" style="font-size:24px;"></i> Pending Daily Tasks
                            </h3>
                            <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full">${pendingDaily.length} remaining</span>
                        </div>
                        ${pendingTasksList}
                        <button onclick="switchTab('tasks')" class="mt-6 text-sm text-blue-600 hover:text-blue-700 font-medium">View all tasks &rarr;</button>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                        <h3 class="text-xl font-semibold flex items-center gap-2 mb-6">
                            <i class="ph ph-gift text-purple-500" style="font-size:24px;"></i> Upcoming Birthdays
                        </h3>
                        ${bdaysList}
                    </div>
                </div>
            </div>`;
        }

        function buildTaskSection(title, type, iconName, colorSet) {
            const typeTasks = tasks.filter(t => t.type === type);
            const completedCount = typeTasks.filter(t => t.completed).length;

            const colorClasses = {
                blue: "text-blue-600 bg-blue-50 border-blue-100",
                indigo: "text-indigo-600 bg-indigo-50 border-indigo-100",
                purple: "text-purple-600 bg-purple-50 border-purple-100"
            }[colorSet];

            let listHTML = typeTasks.length === 0 
                ? `<p class="text-center text-slate-400 py-4">No tasks here yet.</p>` 
                : typeTasks.map(task => `
                    <li class="group flex items-center justify-between p-3 rounded-xl border transition-all ${task.completed ? 'bg-slate-50 border-transparent' : 'bg-white border-slate-200 shadow-sm hover:border-blue-300'}">
                        <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="toggleTask(${task.id})">
                            <button class="transition-colors ${task.completed ? 'text-emerald-500' : 'text-slate-300 hover:text-emerald-400'}">
                                <i class="ph ${task.completed ? 'ph-check-circle' : 'ph-circle'}" style="font-size:24px;"></i>
                            </button>
                            <div class="flex items-center gap-3">
                                <span class="text-lg transition-all ${task.completed ? 'text-slate-400 line-through' : 'text-slate-700 font-medium'}">${task.text}</span>
                                ${task.time ? `<span class="flex items-center gap-1 text-xs px-2 py-1 rounded-md font-semibold ${task.completed ? 'bg-slate-100 text-slate-400' : 'bg-blue-50 text-blue-600'}"><i class="ph ph-bell"></i> ${task.time}</span>` : ''}
                            </div>
                        </div>
                        <button onclick="deleteTask(${task.id})" class="text-slate-300 hover:text-red-500 p-2 rounded-lg opacity-0 group-hover:opacity-100 transition-all focus:opacity-100">
                            <i class="ph ph-trash" style="font-size:18px;"></i>
                        </button>
                    </li>
                `).join('');

            return `
            <div class="mb-8 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-6 py-4 border-b flex items-center gap-3 ${colorClasses}">
                    <i class="ph ${iconName}" style="font-size:24px;"></i>
                    <h3 class="text-xl font-bold">${title}</h3>
                    <span class="ml-auto bg-white bg-opacity-50 px-3 py-1 rounded-full text-sm font-bold">${completedCount} / ${typeTasks.length}</span>
                </div>
                <div class="p-6">
                    <form onsubmit="handleAddTask(event, '${type}')" class="flex flex-col sm:flex-row gap-3 mb-6">
                        <input type="text" name="text" placeholder="Add new ${title.toLowerCase()}..." class="w-full sm:flex-1 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors" required />
                        <input type="time" name="time" class="w-full sm:w-32 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors cursor-pointer" />
                        <button type="submit" class="w-full sm:w-auto bg-slate-900 text-white px-4 py-2 rounded-xl hover:bg-slate-800 transition-colors flex items-center justify-center gap-2">
                            <i class="ph ph-plus" style="font-size:18px;"></i> Add
                        </button>
                    </form>
                    <ul class="space-y-3">${listHTML}</ul>
                </div>
            </div>`;
        }

        function getTasksHTML() {
            return `
            <div class="fade-in">
                <h2 class="text-3xl font-bold text-slate-900 mb-8 flex items-center gap-3">
                    <i class="ph ph-list-checks text-blue-600" style="font-size:32px;"></i> Tasks & Routines
                </h2>
                ${buildTaskSection('Daily Tasks', 'daily', 'ph-calendar', 'blue')}
                ${buildTaskSection('Weekly Tasks', 'weekly', 'ph-calendar-blank', 'indigo')}
                ${buildTaskSection('Monthly Tasks', 'monthly', 'ph-calendar-x', 'purple')}
            </div>`;
        }

        function getBirthdaysHTML() {
            let rows = birthdays.length === 0 
                ? `<tr><td colspan="3" class="p-8 text-center text-slate-500">No birthdays added yet.</td></tr>`
                : birthdays.map(b => `
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                        <td class="p-4 font-medium text-slate-800">${b.name}</td>
                        <td class="p-4 text-slate-600">${new Date(b.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</td>
                        <td class="p-4 text-right">
                            <button onclick="deleteBirthday(${b.id})" class="text-red-400 hover:text-red-600 transition-colors p-2 rounded-lg hover:bg-red-50">
                                <i class="ph ph-trash" style="font-size:18px;"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

            return `
            <div class="fade-in">
                <h2 class="text-3xl font-bold text-slate-900 mb-8 flex items-center gap-3">
                    <i class="ph ph-gift text-purple-600" style="font-size:32px;"></i> Colleague Birthdays
                </h2>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 border-b border-slate-100 bg-slate-50">
                        <form onsubmit="handleAddBirthday(event)" class="flex flex-col sm:flex-row gap-3">
                            <input name="name" placeholder="Colleague Name..." class="w-full sm:flex-1 px-4 py-2 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 transition-colors" required />
                            <input type="date" name="date" class="w-full sm:w-auto px-4 py-2 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 transition-colors text-slate-600" required />
                            <button type="submit" class="w-full sm:w-auto bg-purple-600 text-white px-6 py-2 rounded-xl hover:bg-purple-700 font-medium transition-colors flex items-center justify-center gap-2">
                                <i class="ph ph-plus" style="font-size:18px;"></i> Add Birthday
                            </button>
                        </form>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[600px]">
                            <thead>
                                <tr class="bg-white border-b border-slate-100">
                                    <th class="p-4 font-semibold text-slate-600">Name</th>
                                    <th class="p-4 font-semibold text-slate-600 w-48">Date</th>
                                    <th class="p-4 font-semibold text-slate-600 text-right w-24">Action</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>
            </div>`;
        }

        function getNotesHTML() {
            let notesList = notes.length === 0
                ? `<p class="text-center text-slate-500 py-8">No notes added yet.</p>`
                : `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">` + notes.map(n => `
                    <div class="bg-yellow-50 border border-yellow-100 p-4 rounded-xl relative group">
                        <h4 class="font-bold text-slate-800 mb-2 pr-8">${n.title}</h4>
                        <p class="text-sm text-slate-600 whitespace-pre-wrap">${n.content}</p>
                        <button onclick="deleteNote(${n.id})" class="absolute top-3 right-3 text-yellow-400 hover:text-red-500 p-1 rounded-md opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="ph ph-trash" style="font-size:18px;"></i>
                        </button>
                    </div>
                `).join('') + `</div>`;

            return `
            <div class="fade-in">
                <h2 class="text-3xl font-bold text-slate-900 mb-8 flex items-center gap-3">
                    <i class="ph ph-note text-yellow-500" style="font-size:32px;"></i> Notes & Ideas
                </h2>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                    <div class="p-6 border-b border-slate-100 bg-slate-50">
                        <form onsubmit="handleAddNote(event)" class="flex flex-col gap-3">
                            <input name="title" placeholder="Note Title..." class="w-full px-4 py-2 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-yellow-500 transition-colors" required />
                            <textarea name="content" placeholder="Note Content..." class="w-full px-4 py-2 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-yellow-500 transition-colors resize-none h-24" required></textarea>
                            <button type="submit" class="self-end bg-yellow-500 text-white px-6 py-2 rounded-xl hover:bg-yellow-600 font-medium transition-colors flex items-center gap-2">
                                <i class="ph ph-plus" style="font-size:18px;"></i> Add Note
                            </button>
                        </form>
                    </div>
                </div>
                ${notesList}
            </div>`;
        }

        function getSheetHTML() {
            let rows = sheetTasks.length === 0 
                ? `<tr><td colspan="3" class="p-8 text-center text-slate-500">No monthly tasks added yet.</td></tr>`
                : sheetTasks.map(task => {
                    let colorClass = task.status === 'not started' ? 'bg-slate-100 text-slate-700 border-slate-200' : 
                                     task.status === 'pending' ? 'bg-orange-100 text-orange-700 border-orange-200' : 
                                     'bg-green-100 text-green-700 border-green-200';
                    return `
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                        <td class="p-4 font-medium text-slate-800">${task.task}</td>
                        <td class="p-4">
                            <select onchange="updateSheetStatus(${task.id}, this.value)" class="text-sm font-bold px-3 py-1.5 rounded-lg outline-none cursor-pointer border transition-colors ${colorClass}">
                                <option value="not started" ${task.status === 'not started' ? 'selected' : ''}>Not Started</option>
                                <option value="pending" ${task.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="completed" ${task.status === 'completed' ? 'selected' : ''}>Completed</option>
                            </select>
                        </td>
                        <td class="p-4 text-right">
                            <button onclick="deleteSheetTask(${task.id})" class="text-red-400 hover:text-red-600 transition-colors p-2 rounded-lg hover:bg-red-50">
                                <i class="ph ph-trash" style="font-size:18px;"></i>
                            </button>
                        </td>
                    </tr>`;
                }).join('');

            return `
            <div class="fade-in">
                <h2 class="text-3xl font-bold text-slate-900 mb-8 flex items-center gap-3">
                    <i class="ph ph-table text-emerald-600" style="font-size:32px;"></i> Monthly Task Sheet
                </h2>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 border-b border-slate-100 bg-slate-50">
                        <form onsubmit="handleAddSheetTask(event)" class="flex flex-col sm:flex-row gap-3">
                            <input name="task" placeholder="Enter new monthly sheet task..." class="w-full sm:flex-1 px-4 py-2 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-colors" required />
                            <button type="submit" class="w-full sm:w-auto bg-emerald-600 text-white px-6 py-2 rounded-xl hover:bg-emerald-700 font-medium transition-colors flex items-center justify-center gap-2">
                                <i class="ph ph-plus" style="font-size:18px;"></i> Add Row
                            </button>
                        </form>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[600px]">
                            <thead>
                                <tr class="bg-white border-b border-slate-100">
                                    <th class="p-4 font-semibold text-slate-600">Task Description</th>
                                    <th class="p-4 font-semibold text-slate-600 w-48">Status</th>
                                    <th class="p-4 font-semibold text-slate-600 text-right w-24">Action</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>
            </div>`;
        }

        function getTeamTasksHTML() {
            let rows = teamTasks.length === 0 
                ? `<tr><td colspan="4" class="p-8 text-center text-slate-500">No team tasks assigned yet.</td></tr>`
                : teamTasks.map(task => {
                    let colorClass = task.status === 'pending' ? 'bg-orange-100 text-orange-700 border-orange-200' : 
                                     task.status === 'in progress' ? 'bg-blue-100 text-blue-700 border-blue-200' : 
                                     'bg-green-100 text-green-700 border-green-200';
                    return `
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                        <td class="p-4 font-bold text-slate-700 flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs">
                                ${task.member.charAt(0).toUpperCase()}
                            </div>
                            ${task.member}
                        </td>
                        <td class="p-4 font-medium text-slate-800">${task.task}</td>
                        <td class="p-4">
                            <select onchange="updateTeamTaskStatus(${task.id}, this.value)" class="text-sm font-bold px-3 py-1.5 rounded-lg outline-none cursor-pointer border transition-colors ${colorClass}">
                                <option value="pending" ${task.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="in progress" ${task.status === 'in progress' ? 'selected' : ''}>In Progress</option>
                                <option value="completed" ${task.status === 'completed' ? 'selected' : ''}>Completed</option>
                            </select>
                        </td>
                        <td class="p-4 text-right">
                            <button onclick="deleteTeamTask(${task.id})" class="text-red-400 hover:text-red-600 transition-colors p-2 rounded-lg hover:bg-red-50">
                                <i class="ph ph-trash" style="font-size:18px;"></i>
                            </button>
                        </td>
                    </tr>`;
                }).join('');

            return `
            <div class="fade-in">
                <h2 class="text-3xl font-bold text-slate-900 mb-8 flex items-center gap-3">
                    <i class="ph ph-users text-blue-500" style="font-size:32px;"></i> Team Tracker
                </h2>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 border-b border-slate-100 bg-slate-50">
                        <form onsubmit="handleAddTeamTask(event)" class="flex flex-col md:flex-row gap-3">
                            <input name="member" placeholder="Team Member Name..." class="w-full md:w-1/4 px-4 py-2 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors" required />
                            <input name="task" placeholder="Assigned Task..." class="w-full md:flex-1 px-4 py-2 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors" required />
                            <button type="submit" class="w-full md:w-auto bg-blue-600 text-white px-6 py-2 rounded-xl hover:bg-blue-700 font-medium transition-colors flex items-center justify-center gap-2">
                                <i class="ph ph-plus" style="font-size:18px;"></i> Assign
                            </button>
                        </form>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[700px]">
                            <thead>
                                <tr class="bg-white border-b border-slate-100">
                                    <th class="p-4 font-semibold text-slate-600 w-48">Team Member</th>
                                    <th class="p-4 font-semibold text-slate-600">Assigned Task</th>
                                    <th class="p-4 font-semibold text-slate-600 w-48">Status</th>
                                    <th class="p-4 font-semibold text-slate-600 text-right w-24">Action</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>
            </div>`;
        }

        // --- GLOBAL ACTION HANDLERS ---
        
        window.toggleTask = function(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            renderView();
        }
        window.deleteTask = function(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderView();
        }
        window.handleAddTask = function(e, type) {
            e.preventDefault();
            const text = e.target.elements.text.value;
            const time = e.target.elements.time.value;
            if(text.trim()) {
                tasks.push({ id: Date.now(), text, type, completed: false, time, alarmPlayed: false });
                renderView();
            }
        }

        window.deleteBirthday = function(id) {
            birthdays = birthdays.filter(b => b.id !== id);
            renderView();
        }
        window.handleAddBirthday = function(e) {
            e.preventDefault();
            const name = e.target.elements.name.value;
            const date = e.target.elements.date.value;
            if(name.trim() && date) {
                birthdays.push({ id: Date.now(), name, date });
                renderView();
            }
        }

        window.deleteNote = function(id) {
            notes = notes.filter(n => n.id !== id);
            renderView();
        }
        window.handleAddNote = function(e) {
            e.preventDefault();
            const title = e.target.elements.title.value;
            const content = e.target.elements.content.value;
            if(title.trim()) {
                notes.push({ id: Date.now(), title, content });
                renderView();
            }
        }

        window.deleteSheetTask = function(id) {
            sheetTasks = sheetTasks.filter(t => t.id !== id);
            renderView();
        }
        window.updateSheetStatus = function(id, newStatus) {
            sheetTasks = sheetTasks.map(t => t.id === id ? { ...t, status: newStatus } : t);
            renderView(); // to update colors
        }
        window.handleAddSheetTask = function(e) {
            e.preventDefault();
            const task = e.target.elements.task.value;
            if(task.trim()) {
                sheetTasks.push({ id: Date.now(), task, status: 'not started' });
                renderView();
            }
        }

        window.deleteTeamTask = function(id) {
            teamTasks = teamTasks.filter(t => t.id !== id);
            renderView();
        }
        window.updateTeamTaskStatus = function(id, newStatus) {
            teamTasks = teamTasks.map(t => t.id === id ? { ...t, status: newStatus } : t);
            renderView();
        }
        window.handleAddTeamTask = function(e) {
            e.preventDefault();
            const member = e.target.elements.member.value;
            const task = e.target.elements.task.value;
            if(member.trim() && task.trim()) {
                teamTasks.push({ id: Date.now(), member, task, status: 'pending' });
                renderView();
            }
        }
    </script>
</body>
</html>
